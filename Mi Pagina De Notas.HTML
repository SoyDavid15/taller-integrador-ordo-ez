<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Promedio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-calculadora">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label>Nota 1:</label>
        <input type="number" id="nota1" step="0.1">

        <label>Nota 2:</label>
        <input type="number" id="nota2" step="0.1">

        <label>Nota 3:</label>
        <input type="number" id="nota3" step="0.1">

        <button onclick="calcularPromedio()">Calcular</button>

        <p id="resultadoPromedio"></p>
        <p id="estadoAprobacion"></p>
    </div>

<script>

let promedioCalculado = 0;
const cantidadNotas = 3;

function calcularPromedio() {

    let valorNota1 = parseFloat(document.getElementById("nota1").value);
    let valorNota2 = parseFloat(document.getElementById("nota2").value);
    let valorNota3 = parseFloat(document.getElementById("nota3").value);

    console.log("valores capturados:", valorNota1, valorNota2, valorNota3);

    if (isNaN(valorNota1) || isNaN(valorNota2) || isNaN(valorNota3)) {
        document.getElementById("resultadoPromedio").innerHTML = "Debe ingresar las tres notas.";
        return;
    }

    promedioCalculado = (valorNota1 + valorNota2 + valorNota3) / cantidadNotas;

    document.getElementById("resultadoPromedio").innerHTML = "Promedio: " + promedioCalculado.toFixed(2);

    if (promedioCalculado >= 3.0) {
        document.getElementById("estadoAprobacion").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("estadoAprobacion").innerHTML = "Resultado: reprobado";
    }

    console.log("promedio calculado");
}

console.log("pagina cargada");

</script>

</body>
</html>
